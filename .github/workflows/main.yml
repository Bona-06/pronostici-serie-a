name: aggiorna-dati
on:
  schedule:
    - cron: '20 5 * * *'    # ogni giorno alle 05:20 UTC (06:20 in Italia, ora solare)
  workflow_dispatch:         # permette anche l'avvio manuale

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Scarica risultati e calendario
        run: python update_data.py
      - name: Salva e pubblica i dati aggiornati
        run: |
          git config user.name "aggiorna-dati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "Nessun cambiamento" || (git commit -m "Dati aggiornati al $(date +%F)" && git push)
